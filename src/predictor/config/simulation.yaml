/**:
  ros__parameters:
    # Relative file paths resolve from this YAML's directory. Use a new output_dir for each run.
    output_dir: ../../../outputs/pose_kf_demo
    input_csv: ""  # optional: t,px,py,pz,vx,vy,vz,ax,ay,az; seconds, SI, world frame
    duration: 30.0
    sample_rate: 50.0
    trajectory: figure8  # hover | straight | acceleration | circle | helix | figure8 | sinusoid
    # World frame, SI units. input_csv overrides the built-in trajectory.
    trajectory_origin: [0.0, 0.0, 2.0]  # start for linear motion; center for periodic motion
    # Optional trajectory_velocity: [1.0, 0.4, 0.0]; acceleration defaults to [0.0, 0.2, 0.0]
    trajectory_acceleration: [0.2, 0.0, 0.0]
    trajectory_amplitude: [4.0, 3.0, 0.6]
    trajectory_frequency: [0.35, 0.7, 0.5]  # rad/s; figure8 uses y = 2 * x frequency
    trajectory_phase: [0.0, 0.0, 0.0]  # rad
    trajectory_radius: 4.0
    trajectory_angular_speed: 0.35  # rad/s, negative reverses direction
    trajectory_circle_phase: 0.0  # rad
    trajectory_vertical_speed: 0.2  # m/s, helix only
    inject_noise: true
    noise_seed: 42
    position_noise_std: 0.15
    velocity_noise_std: 0.10
    cv_accel_density: 0.30
    ca_jerk_density: 1.0
    imm_pose_accel_density: 0.30  # unmodeled acceleration density for IMM pose_kf hypothesis
    stay_probability: 0.98
    motion_models: [cv, ca]  # selectable: cv | ca | body_velocity | pose_kf; order defines matrix/probability order
    # Optional flattened row-major NxN matrix; otherwise use symmetric stay_probability.
    # model_transition: [0.98, 0.02, 0.02, 0.98]
    # model_initial_probability: [0.5, 0.5]
    use_attitude: true
    use_angular_velocity: false  # EGO fake_drone stores acceleration in twist.angular!
    attitude_noise_std: 0.05  # local rotation, rad
    angular_velocity_noise_std: 0.10  # body axes, rad/s
    angular_accel_density: 0.30
    prediction_algorithm: pose_kf  # imm | pose_kf | kf (position-only CV baseline)
    pose_kf_process_variance: 0.01  # sigma_q, variance per update (paper convention)
    pose_kf_measurement_variance: 0.1  # sigma_r, not standard deviation
    pose_kf_gravity: 9.81
    pose_kf_world_up_sign: 1.0  # ROS ENU +1; paper down-positive -1
    offline_plot: true
    plot_label: Pose-KF
    baseline_samples: []  # paths relative to this YAML, or absolute paths
    baseline_labels: []  # one unique label for each baseline_samples entry
    comparison_metrics_file: comparison_metrics.json
    prediction_step: 0.05
    prediction_steps: 20
    max_time_gap: 1.0
    odometry_topic: /prediction_demo/odometry
    command_topic: /prediction_demo/command
    show_viewer: true
    record_video: true
    samples_file: samples.csv
    predictions_file: predictions.csv
    snapshot_file: resolved.yaml
    launch_log_file: launch.log
    ros_log_dir: ros_logs
    matplotlib_cache_dir: .matplotlib
    frame_dir: frames
    frame_timestamps_file: frame_times.csv
    video_manifest_file: video_frames.ffconcat
    video_file: simulation.mp4
    plot_file: summary.png
    metrics_file: metrics.json
    # 主题、相机、网格和曲线样式见同目录 visualization.yaml。
    # 初始窗口尺寸（运行中可拖动缩放）；录像固定为此尺寸，奇数自动补齐为偶数。
    window_width: 1280
    window_height: 800
    video_fps: 15
    ffmpeg_path: /usr/bin/ffmpeg
