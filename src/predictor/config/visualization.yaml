# Pangolin 轨迹预测面板。修改后在下一次启动时生效；录像同步采用这些样式。
# 窗口尺寸、video_fps、record_video 和输出路径仍在 simulation.yaml 中配置。
prediction_viewer:
  ros__parameters:
    # 浅色/深色模式，自动设置背景、文字、轨迹、曲线与机体配色。
    theme: light                    # light | dark

    # 左侧三维轨迹、观测点与位置不确定度。
    trajectory_line_width: 2.0       # 像素
    observation_point_size: 2.0     # 像素
    estimate_point_size: 9.0        # 像素
    max_track_points: 20000         # 保留最近的真实/观测/估计点，不截断 CSV
    show_uncertainty: true          # 估计位置的三轴 2σ 线段
    show_legend: true               # 标题、图例和当前时间

    # 运动中的四旋翼：使用里程计四元数（机体系到世界系）驱动姿态。
    show_drone: true
    drone_pose_source: truth        # truth: 仿真真值；estimate: 滤波估计（需启用姿态观测）
    drone_mesh_file: ""             # 空字符串使用内置 hummingbird.ply；自定义 PLY 相对本 YAML
    drone_scale: 2.0                # 仅显示倍率，原模型翼展约 0.53 m，不影响数值仿真
    show_drone_axes: true           # 机体系 X 红、Y 绿、Z 蓝
    drone_axis_length: 0.45         # 原模型坐标下的 m，随 drone_scale 一起缩放

    # 世界坐标系地面网格，单位 m；extent 为从原点向两侧延伸的距离。
    show_grid: true
    grid_extent: 10.0
    grid_spacing: 1.0               # extent / spacing 不超过 1000

    # 初始相机，Z 轴向上；可在窗口中继续用鼠标调整。
    camera_eye: [8.0, -10.0, 8.0]
    camera_target: [0.0, 0.0, 2.0]
    camera_focal_length: 850.0      # 像素，越大视角越窄
    camera_near_clip: 0.1          # m
    camera_far_clip: 1000.0        # m，必须大于 near_clip

    # 右侧曲线初始纵轴上限，横轴跟随仿真 duration。
    error_plot_max: 1.0             # m，必须为正
    covariance_plot_max: 0.1      # m²，必须为正

    # auto selects panels from prediction_algorithm; override: imm | pose_kf | kf
    plot_profile: auto
    velocity_error_plot_max: 2.0
