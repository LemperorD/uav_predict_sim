[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-limm"
version = "0.1.0"
description = "Differential Transformer-LSTM forecasting and learning-based IMM"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
uav-limm = "uav_limm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uav_limm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
